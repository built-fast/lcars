name: Upload zip on new tag

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF##refs/tags/}" >> "$GITHUB_ENV"

      - name: Prepare zip archive
        run: FORMULA=lcars VERSION="$VERSION" make archive

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" "pkg/lcars-${VERSION}.zip" --generate-notes

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          owner: built-fast
          repositories: homebrew-devtools
          permission-actions: write

      - name: Update homebrew tap
        run: |
          gh workflow run bump-formula.yml \
            -f formula=lcars \
            -f "version=$VERSION" \
            -f type=bash \
            -R built-fast/homebrew-devtools
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
